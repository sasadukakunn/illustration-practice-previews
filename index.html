<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Illustration Practice Tool - Phase 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; }
  .touch-none { touch-action: none; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.166.0",
    "three/addons/": "https://esm.sh/three@0.166.0/examples/jsm/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three",
    "zustand": "https://esm.sh/zustand@4.5.5?external=react"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, { useEffect, useRef, useCallback, useState, Suspense } from "react";
import { createRoot } from "react-dom/client";
import { Canvas, useFrame, useThree } from "@react-three/fiber";
import { create } from "zustand";
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const e = React.createElement;

// ============================================================
// VRM モデルの URL 設定(ここを変えれば差し替え可能)
// ============================================================
//
// デフォルト: Avatar_Orion.vrm (CC0、確実に動作)
// AvatarSample_A/B/C を使いたい場合:
//   1. https://hub.vroid.com/ で各キャラのページにアクセス
//   2. VRM ファイルをダウンロード(ログイン必要)
//   3. 自分の GitHub リポジトリにアップロード
//   4. 以下の URL をそのファイルへの raw URL に変更
//
// URL の構造例:
//   https://raw.githubusercontent.com/<your-name>/<repo>/main/avatar.vrm

const VRM_URL = "https://raw.githubusercontent.com/madjin/vrm-samples/master/Avatar_Orion.vrm";

// ============================================================
// lib/coordinates
// ============================================================

const PHI_MIN = 0.1;
const PHI_MAX = 179.9;
const RADIUS_MIN = 0.8;
const RADIUS_MAX = 20;

function sphericalToCartesian(sph, target) {
  const phiRad = (sph.phi * Math.PI) / 180;
  const thetaRad = (sph.theta * Math.PI) / 180;
  return {
    x: target.x + sph.radius * Math.sin(phiRad) * Math.cos(thetaRad),
    y: target.y + sph.radius * Math.cos(phiRad),
    z: target.z + sph.radius * Math.sin(phiRad) * Math.sin(thetaRad),
  };
}

function normalizeTheta(theta) { return ((theta % 360) + 360) % 360; }
function clampPhi(phi) { return Math.max(PHI_MIN, Math.min(PHI_MAX, phi)); }
function clampRadius(r) { return Math.max(RADIUS_MIN, Math.min(RADIUS_MAX, r)); }

// ============================================================
// lib/bodyParts
// ============================================================

const SINGLE_PARTS = ["head", "torso", "arm_left", "arm_right", "leg_left", "leg_right"];
const COMPOSITE_PARTS = ["upper_body", "lower_body", "full_body"];

const PART_LABELS = {
  head: "頭", torso: "胴",
  arm_left: "左腕", arm_right: "右腕",
  leg_left: "左脚", leg_right: "右脚",
  upper_body: "上半身", lower_body: "下半身", full_body: "全身",
};

function isPartSelected(selected, part) {
  if (selected === "full_body") return true;
  if (selected === part) return true;
  if (selected === "upper_body") return ["head", "torso", "arm_left", "arm_right"].includes(part);
  if (selected === "lower_body") return ["leg_left", "leg_right"].includes(part);
  return false;
}

// VRM 標準ボーン名 → 部位 のマッピング
// VRM 0.x/1.0、Mixamo、Bone命名規則の揺れに対応
const PART_BONE_KEYWORDS = {
  head: ["head", "neck"],
  torso: ["hips", "spine", "chest", "pelvis", "upperchest"],
  arm_right: ["rightshoulder", "rightupperarm", "rightlowerarm", "rightforearm", "righthand", "rightarm"],
  arm_left: ["leftshoulder", "leftupperarm", "leftlowerarm", "leftforearm", "lefthand", "leftarm"],
  leg_right: ["rightupperleg", "rightlowerleg", "rightleg", "rightfoot", "rightthigh", "rightshin"],
  leg_left: ["leftupperleg", "leftlowerleg", "leftleg", "leftfoot", "leftthigh", "leftshin"],
};

function getBonePart(boneName) {
  const lower = boneName.toLowerCase();
  // 指、目などは除外
  if (lower.includes("eye") || lower.includes("jaw") || lower.includes("toe")) {
    if (lower.includes("right") && lower.includes("toe")) return "leg_right";
    if (lower.includes("left") && lower.includes("toe")) return "leg_left";
    return null;
  }
  if (lower.includes("thumb") || lower.includes("index") || lower.includes("middle") || 
      lower.includes("ring") || lower.includes("little") || lower.includes("pinky")) {
    if (lower.includes("right")) return "arm_right";
    if (lower.includes("left")) return "arm_left";
    return null;
  }
  for (const [part, keywords] of Object.entries(PART_BONE_KEYWORDS)) {
    for (const kw of keywords) {
      if (lower.includes(kw)) return part;
    }
  }
  return null;
}

// ============================================================
// lib/cameraPresets(VRM用に距離を調整)
// ============================================================

const CAMERA_PRESETS = [
  { name: "front", label: "正面", spherical: { theta: 0, phi: 90, radius: 3.5 }, focalLengthMm: 50 },
  { name: "three_quarter_front", label: "斜め前", spherical: { theta: 45, phi: 90, radius: 3.5 }, focalLengthMm: 50 },
  { name: "side_right", label: "右側面", spherical: { theta: 90, phi: 90, radius: 3.5 }, focalLengthMm: 50 },
  { name: "back", label: "背面", spherical: { theta: 180, phi: 90, radius: 3.5 }, focalLengthMm: 50 },
  { name: "side_left", label: "左側面", spherical: { theta: 270, phi: 90, radius: 3.5 }, focalLengthMm: 50 },
  { name: "low_angle", label: "アオリ", spherical: { theta: 30, phi: 120, radius: 3.0 }, focalLengthMm: 35 },
  { name: "high_angle", label: "フカン", spherical: { theta: 30, phi: 60, radius: 3.0 }, focalLengthMm: 35 },
  { name: "top_down", label: "真俯瞰", spherical: { theta: 0, phi: 5, radius: 4.0 }, focalLengthMm: 50 },
];

// ============================================================
// stores
// ============================================================

const INITIAL_CAMERA = {
  spherical: { theta: 0, phi: 90, radius: 3.5 },
  target: { x: 0, y: 1.0, z: 0 },  // VRMの中心は約1m
  focalLengthMm: 50,
  presetName: "front",
};

const useCameraStore = create((set) => ({
  ...INITIAL_CAMERA,
  setAngle: (theta, phi) => set((state) => ({
    spherical: { theta: normalizeTheta(theta), phi: clampPhi(phi), radius: state.spherical.radius },
    presetName: null,
  })),
  setRadius: (radius) => set((state) => ({
    spherical: { ...state.spherical, radius: clampRadius(radius) },
    presetName: null,
  })),
  applyPreset: (preset) => set({
    spherical: { ...preset.spherical },
    focalLengthMm: preset.focalLengthMm,
    presetName: preset.name,
  }),
  reset: () => set({ ...INITIAL_CAMERA }),
}));

const usePoseStore = create((set) => ({
  selectedPart: "full_body",
  setSelectedPart: (part) => set({ selectedPart: part }),
}));

// ロード状態
const useLoadStore = create((set) => ({
  status: "loading", // loading | ready | error
  progress: 0,
  error: null,
  setProgress: (p) => set({ progress: p }),
  setReady: () => set({ status: "ready" }),
  setError: (err) => set({ status: "error", error: err }),
}));

// ============================================================
// VRM Mannequin コンポーネント
// ============================================================

const SELECTED_TINT = new THREE.Color(1.0, 0.35, 0.35);
const DEFAULT_TINT = new THREE.Color(1.0, 1.0, 1.0);

function VRMMannequin() {
  const groupRef = useRef();
  const [gltf, setGltf] = useState(null);
  const skinnedMeshesRef = useRef([]);
  const selectedPart = usePoseStore((s) => s.selectedPart);
  const setProgress = useLoadStore((s) => s.setProgress);
  const setReady = useLoadStore((s) => s.setReady);
  const setError = useLoadStore((s) => s.setError);

  // VRM ロード(一度だけ)
  useEffect(() => {
    const loader = new GLTFLoader();
    loader.load(
      VRM_URL,
      (loaded) => {
        // SkinnedMesh を集める & 頂点カラー属性を準備
        const skins = [];
        loaded.scene.traverse((obj) => {
          if (obj.isSkinnedMesh) {
            // 頂点カラー初期化(全部白)
            const vertCount = obj.geometry.attributes.position.count;
            const colors = new Float32Array(vertCount * 3);
            for (let i = 0; i < vertCount; i++) {
              colors[i * 3] = 1.0;
              colors[i * 3 + 1] = 1.0;
              colors[i * 3 + 2] = 1.0;
            }
            obj.geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

            // マテリアルを vertexColors 有効に
            const applyVC = (mat) => {
              if (mat) {
                mat.vertexColors = true;
                mat.needsUpdate = true;
              }
            };
            if (Array.isArray(obj.material)) {
              obj.material.forEach(applyVC);
            } else {
              applyVC(obj.material);
            }

            // 各頂点について最も影響強いボーンを判定して記録
            const skinIndex = obj.geometry.attributes.skinIndex;
            const skinWeight = obj.geometry.attributes.skinWeight;
            const vertexParts = new Array(vertCount).fill(null);
            
            for (let v = 0; v < vertCount; v++) {
              let maxWeight = 0;
              let maxBoneIdx = 0;
              for (let i = 0; i < 4; i++) {
                const w = skinWeight.getComponent(v, i);
                if (w > maxWeight) {
                  maxWeight = w;
                  maxBoneIdx = skinIndex.getComponent(v, i);
                }
              }
              const bone = obj.skeleton.bones[maxBoneIdx];
              if (bone) {
                vertexParts[v] = getBonePart(bone.name);
              }
            }
            
            skins.push({ mesh: obj, vertexParts, colors });
          }
        });
        skinnedMeshesRef.current = skins;
        
        // VRM 0.x は前方が -Z なので 180度回転(顔をカメラ側に)
        loaded.scene.rotation.y = Math.PI;
        
        setGltf(loaded);
        setReady();
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          setProgress(Math.round((xhr.loaded / xhr.total) * 100));
        }
      },
      (err) => {
        console.error("VRM load error:", err);
        setError(err?.message ?? "Load failed");
      }
    );
  }, []);

  // 部位選択変更時、頂点カラーを更新
  useEffect(() => {
    if (!gltf) return;
    const skins = skinnedMeshesRef.current;
    for (const { mesh, vertexParts, colors } of skins) {
      for (let v = 0; v < vertexParts.length; v++) {
        const part = vertexParts[v];
        const highlight = part && isPartSelected(selectedPart, part);
        if (highlight) {
          colors[v * 3] = SELECTED_TINT.r;
          colors[v * 3 + 1] = SELECTED_TINT.g;
          colors[v * 3 + 2] = SELECTED_TINT.b;
        } else {
          colors[v * 3] = DEFAULT_TINT.r;
          colors[v * 3 + 1] = DEFAULT_TINT.g;
          colors[v * 3 + 2] = DEFAULT_TINT.b;
        }
      }
      mesh.geometry.attributes.color.needsUpdate = true;
    }
  }, [selectedPart, gltf]);

  if (!gltf) return null;
  return e("primitive", { object: gltf.scene, ref: groupRef });
}

// 床+ライティング(マネキンと分離)
function Stage() {
  return e("group", null,
    e("ambientLight", { intensity: 0.6 }),
    e("directionalLight", { position: [3, 5, 3], intensity: 0.8 }),
    e("directionalLight", { position: [-3, 3, -3], intensity: 0.3 }),
    e("directionalLight", { position: [0, 3, -5], intensity: 0.2 }),

    // 円形の床
    e("mesh", { rotation: [-Math.PI / 2, 0, 0], position: [0, 0, 0] },
      e("circleGeometry", { args: [3, 64] }),
      e("meshStandardMaterial", { color: "#e2e8f0", roughness: 0.9 })
    ),
    // 同心円リング
    e("mesh", { rotation: [-Math.PI / 2, 0, 0], position: [0, 0.005, 0] },
      e("ringGeometry", { args: [1, 1.015, 64] }),
      e("meshStandardMaterial", { color: "#cbd5e1" })
    ),
    e("mesh", { rotation: [-Math.PI / 2, 0, 0], position: [0, 0.005, 0] },
      e("ringGeometry", { args: [2, 2.015, 64] }),
      e("meshStandardMaterial", { color: "#cbd5e1" })
    )
  );
}

// ============================================================
// CameraController
// ============================================================

function CameraController() {
  const spherical = useCameraStore((s) => s.spherical);
  const target = useCameraStore((s) => s.target);
  const focalLengthMm = useCameraStore((s) => s.focalLengthMm);
  const { camera } = useThree();

  useEffect(() => {
    const fovDeg = (2 * Math.atan(24 / (2 * focalLengthMm)) * 180) / Math.PI;
    if ("fov" in camera) {
      camera.fov = fovDeg;
      camera.updateProjectionMatrix();
    }
  }, [focalLengthMm, camera]);

  useFrame(() => {
    const pos = sphericalToCartesian(spherical, target);
    camera.position.set(pos.x, pos.y, pos.z);
    camera.lookAt(target.x, target.y, target.z);
  });

  return null;
}

// ============================================================
// DragHandler
// ============================================================

const ROTATION_SPEED = 0.4;
const ZOOM_SPEED = 0.005;

function DragHandler({ children }) {
  const setAngle = useCameraStore((s) => s.setAngle);
  const setRadius = useCameraStore((s) => s.setRadius);
  const dragRef = useRef(null);
  const pinchRef = useRef(null);

  const handlePointerDown = useCallback((ev) => {
    const state = useCameraStore.getState();
    dragRef.current = {
      startX: ev.clientX, startY: ev.clientY,
      startTheta: state.spherical.theta, startPhi: state.spherical.phi,
    };
    try { ev.target.setPointerCapture(ev.pointerId); } catch {}
  }, []);

  const handlePointerMove = useCallback((ev) => {
    if (!dragRef.current) return;
    const dx = ev.clientX - dragRef.current.startX;
    const dy = ev.clientY - dragRef.current.startY;
    setAngle(
      dragRef.current.startTheta + dx * ROTATION_SPEED,
      dragRef.current.startPhi + dy * ROTATION_SPEED
    );
  }, [setAngle]);

  const handlePointerUp = useCallback((ev) => {
    dragRef.current = null;
    try { ev.target.releasePointerCapture(ev.pointerId); } catch {}
  }, []);

  const handleWheel = useCallback((ev) => {
    const current = useCameraStore.getState().spherical.radius;
    setRadius(current + ev.deltaY * ZOOM_SPEED);
  }, [setRadius]);

  const handleTouchStart = useCallback((ev) => {
    if (ev.touches.length === 2) {
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      pinchRef.current = {
        startDist: Math.sqrt(dx * dx + dy * dy),
        startRadius: useCameraStore.getState().spherical.radius,
      };
      dragRef.current = null;
    }
  }, []);

  const handleTouchMove = useCallback((ev) => {
    if (ev.touches.length === 2 && pinchRef.current) {
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      setRadius(pinchRef.current.startRadius * (pinchRef.current.startDist / dist));
    }
  }, [setRadius]);

  const handleTouchEnd = useCallback(() => { pinchRef.current = null; }, []);

  return e("div", {
    className: "absolute inset-0 touch-none",
    onPointerDown: handlePointerDown,
    onPointerMove: handlePointerMove,
    onPointerUp: handlePointerUp,
    onPointerCancel: handlePointerUp,
    onWheel: handleWheel,
    onTouchStart: handleTouchStart,
    onTouchMove: handleTouchMove,
    onTouchEnd: handleTouchEnd,
  }, children);
}

// ============================================================
// UI
// ============================================================

function CameraInfo() {
  const spherical = useCameraStore((s) => s.spherical);
  const focalLengthMm = useCameraStore((s) => s.focalLengthMm);
  const presetName = useCameraStore((s) => s.presetName);

  return e("div", {
    className: "absolute top-3 left-3 bg-white/95 backdrop-blur rounded-lg p-3 text-xs shadow-lg pointer-events-none border border-slate-200"
  },
    e("div", { className: "font-semibold mb-1.5 text-slate-700" }, "Camera"),
    e("div", { className: "font-mono space-y-0.5 text-slate-600" },
      e("div", null, `θ ${spherical.theta.toFixed(0)}°`),
      e("div", null, `φ ${spherical.phi.toFixed(0)}°`),
      e("div", null, `r ${spherical.radius.toFixed(2)}`),
      e("div", null, `focal ${focalLengthMm}mm`),
      e("div", { className: "pt-1 mt-1 border-t border-slate-200 text-slate-500" },
        presetName ?? "custom"
      )
    )
  );
}

function PresetButtons() {
  const applyPreset = useCameraStore((s) => s.applyPreset);
  const currentPreset = useCameraStore((s) => s.presetName);

  return e("div", {
    className: "absolute top-3 right-3 bg-white/95 backdrop-blur rounded-lg p-2.5 shadow-lg border border-slate-200"
  },
    e("div", { className: "text-xs font-semibold mb-1.5 text-slate-700" }, "アングル"),
    e("div", { className: "grid grid-cols-2 gap-1" },
      ...CAMERA_PRESETS.map((preset) =>
        e("button", {
          key: preset.name,
          type: "button",
          onClick: () => applyPreset(preset),
          className: `text-xs px-2 py-1 rounded transition-colors ${
            currentPreset === preset.name
              ? "bg-blue-600 text-white"
              : "bg-slate-100 hover:bg-slate-200 text-slate-700"
          }`,
        }, preset.label)
      )
    )
  );
}

function PartSelector() {
  const selectedPart = usePoseStore((s) => s.selectedPart);
  const setSelectedPart = usePoseStore((s) => s.setSelectedPart);

  const renderButton = (part) =>
    e("button", {
      key: part,
      type: "button",
      onClick: () => setSelectedPart(part),
      className: `text-xs px-2.5 py-1 rounded transition-colors ${
        selectedPart === part
          ? "bg-red-500 text-white"
          : "bg-slate-100 hover:bg-slate-200 text-slate-700"
      }`,
    }, PART_LABELS[part]);

  return e("div", {
    className: "absolute bottom-3 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur rounded-lg p-2.5 shadow-lg border border-slate-200"
  },
    e("div", { className: "text-xs font-semibold mb-1.5 text-slate-700 text-center" }, "部位"),
    e("div", { className: "flex flex-col gap-1.5" },
      e("div", { className: "flex gap-1 justify-center" },
        ...COMPOSITE_PARTS.map(renderButton)
      ),
      e("div", { className: "flex gap-1 justify-center flex-wrap max-w-xs" },
        ...SINGLE_PARTS.map(renderButton)
      )
    )
  );
}

function HelpHint() {
  return e("div", {
    className: "absolute bottom-3 right-3 bg-white/95 backdrop-blur rounded-lg p-2.5 shadow-lg text-xs border border-slate-200 max-w-[140px]"
  },
    e("div", { className: "font-semibold mb-1 text-slate-700" }, "操作"),
    e("ul", { className: "space-y-0.5 text-slate-600" },
      e("li", null, "ドラッグ: 回転"),
      e("li", null, "ピンチ: ズーム")
    )
  );
}

// ロードオーバーレイ
function LoadingOverlay() {
  const status = useLoadStore((s) => s.status);
  const progress = useLoadStore((s) => s.progress);
  const error = useLoadStore((s) => s.error);
  
  if (status === "ready") return null;
  
  return e("div", {
    className: "absolute inset-0 bg-slate-100/90 backdrop-blur flex items-center justify-center pointer-events-none z-50"
  },
    e("div", { className: "bg-white rounded-lg p-6 shadow-lg max-w-sm text-center" },
      status === "loading" && e("div", null,
        e("div", { className: "text-sm font-semibold mb-3 text-slate-700" }, "3Dモデルを読み込み中..."),
        e("div", { className: "w-48 h-2 bg-slate-200 rounded-full overflow-hidden mx-auto" },
          e("div", {
            className: "h-full bg-blue-500 transition-all duration-200",
            style: { width: `${progress}%` }
          })
        ),
        e("div", { className: "text-xs text-slate-500 mt-2" }, `${progress}%`)
      ),
      status === "error" && e("div", null,
        e("div", { className: "text-sm font-semibold text-red-600 mb-2" }, "読み込み失敗"),
        e("div", { className: "text-xs text-slate-600 break-all" }, error ?? "Unknown error"),
        e("div", { className: "text-xs text-slate-500 mt-3" },
          "VRM_URL の値を確認してください"
        )
      )
    )
  );
}

// ============================================================
// Main App
// ============================================================

function App() {
  return e("div", { className: "w-full h-screen bg-gradient-to-b from-slate-100 to-slate-200 relative overflow-hidden" },
    e(DragHandler, null,
      e(Canvas, {
        camera: { position: [0, 1, 3.5], fov: 50 },
        dpr: [1, 2],
        gl: { antialias: true },
      },
        e(CameraController, null),
        e(Stage, null),
        e(VRMMannequin, null)
      )
    ),
    e(CameraInfo, null),
    e(PresetButtons, null),
    e(PartSelector, null),
    e(HelpHint, null),
    e(LoadingOverlay, null)
  );
}

const root = createRoot(document.getElementById("root"));
root.render(e(App, null));
</script>
</body>
</html>
